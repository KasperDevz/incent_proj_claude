services:
  db:
    image: postgres:16-alpine
    container_name: incent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: incent
      POSTGRES_PASSWORD: incent
      POSTGRES_DB: incent_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
